name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and typecheck
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check shared tooltip interactions
        run: npm run test:ui
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build signed document helper
        run: npm run documents:build
      - name: Verify fixed document renderer
        run: .local-data/document-helper/runtime/python/bin/python3.12 -I -B apps/desktop/native/document-helper/test_renderer.py
      - name: Verify native document boundary and Chat lifecycle
        run: ZQ_TEST_DOCUMENT_HELPER=1 node --test --test-concurrency=1 apps/desktop/tests/document-helper-native.test.cjs apps/desktop/tests/chat-document-helper.test.cjs
      - name: Verify native document fonts in preview
        run: ZQ_TEST_DOCUMENT_HELPER=1 node --test packages/ui/artifact-document-fonts.test.cjs
